<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prompts — Update or Die</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#f7f7f7;color:#111}
.hdr{background:#fff;border-bottom:1px solid #ebebeb;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.logo{font-size:16px;font-weight:700;color:#111}
.logo em{color:#21d6f1;font-style:normal}
.logo small{color:#bbb;font-size:12px;margin-left:6px;font-weight:400}
.btn{border:1px solid #e0e0e0;background:#fff;color:#111;border-radius:8px;padding:6px 14px;font-size:12px;cursor:pointer;font-family:'Inter',sans-serif}
.btn:hover{background:#f5f5f5}
.btn-c{background:#21d6f1;color:#fff;border-color:#21d6f1}
.btn-c:hover{background:#0ab8d4}
.wrap{max-width:820px;margin:0 auto;padding:24px 16px}
.hero{background:#fff;border-radius:14px;padding:28px 32px;margin-bottom:20px;border:1px solid #ebebeb}
.hero-lbl{font-size:11px;font-weight:700;letter-spacing:0.08em;color:#0ab8d4;text-transform:uppercase;margin-bottom:8px}
.hero h1{font-size:28px;font-weight:900;color:#111;line-height:1.25;margin-bottom:8px}
.hero h1 span{color:#21d6f1}
.hero p{color:#888;font-size:14px;line-height:1.65;max-width:480px}
input,textarea,select{width:100%;border:1px solid #e0e0e0;border-radius:8px;padding:9px 12px;font-size:13px;color:#111;background:#fff;font-family:'Inter',sans-serif}
input:focus,textarea:focus,select:focus{outline:none;border-color:#21d6f1}
textarea{resize:vertical;min-height:110px}
.adm{background:#fff;border:1px solid #ebebeb;border-radius:14px;padding:20px;margin-bottom:20px;display:none}
.adm h2{font-size:14px;font-weight:700;color:#111;margin-bottom:14px}
.row{margin-bottom:12px}
.lbl{font-size:11px;color:#888;margin-bottom:4px;display:block;font-weight:500}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tog{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.tog span{font-size:12px;color:#888}
.sw{position:relative;width:36px;height:20px;cursor:pointer;flex-shrink:0}
.sw input{opacity:0;width:0;height:0}
.sl{position:absolute;top:0;left:0;right:0;bottom:0;background:#ddd;border-radius:20px;transition:0.2s}
.sw input:checked+.sl{background:#21d6f1}
.sl:before{content:"";position:absolute;height:14px;width:14px;left:3px;bottom:3px;background:white;border-radius:50%;transition:0.2s}
.sw input:checked+.sl:before{transform:translateX(16px)}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.pill{background:#fff;color:#777;border:1px solid #e0e0e0;border-radius:20px;padding:5px 13px;font-size:12px;cursor:pointer;font-family:'Inter',sans-serif}
.pill.on{background:#21d6f1;color:#fff;border-color:#21d6f1;font-weight:600}
.cnt{color:#bbb;font-size:11px;letter-spacing:0.07em;text-transform:uppercase;margin:12px 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{background:#fff;border:1px solid #ebebeb;border-radius:12px;padding:18px;cursor:pointer;transition:all 0.15s;position:relative}
.card:hover{border-color:#21d6f188;box-shadow:0 4px 16px rgba(33,214,241,0.1);transform:translateY(-1px)}
.ctags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.tag{font-size:10px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;border-radius:4px;padding:2px 7px}
.ttool{font-size:10px;color:#999;border:1px solid #eee;border-radius:4px;padding:2px 7px;background:#fafafa}
.card h3{font-size:14px;font-weight:700;color:#111;line-height:1.4;margin-bottom:6px}
.card p{color:#999;font-size:12px;line-height:1.55}
.cta{margin-top:12px;font-size:11px;font-weight:700;color:#0ab8d4}
.cta.lk{color:#ccc}
.pm{position:absolute;top:12px;right:12px;font-size:10px;background:#f5f5f5;color:#bbb;border-radius:4px;padding:2px 7px}
.del{position:absolute;top:10px;right:10px;background:none;border:none;color:#bbb;cursor:pointer;font-size:16px;padding:2px 6px;border-radius:4px;font-family:'Inter',sans-serif;display:none}
.del:hover{background:#fff0f0;color:#e00}
.empty{text-align:center;color:#ccc;padding:48px 0;font-size:14px}
#detail{display:none;max-width:660px;margin:0 auto;padding:0 16px 60px}
.bk{background:none;border:none;color:#aaa;cursor:pointer;font-size:12px;padding:18px 0 14px;font-family:'Inter',sans-serif;display:block}
#detail h1{font-size:22px;font-weight:800;color:#111;line-height:1.3;margin-bottom:10px}
.ds{color:#777;font-size:14px;line-height:1.65;margin-bottom:24px}
.pbox{background:#d8f9fe;border-radius:10px;padding:20px 24px;margin-bottom:16px;border:1px solid #b8f0fc}
.plbl{font-size:10px;font-weight:700;letter-spacing:0.08em;color:#0ab8d4;text-transform:uppercase;margin-bottom:12px}
.ptxt{font-family:'Courier New',monospace;font-size:13px;line-height:1.85;color:#111;white-space:pre-wrap;word-break:break-word}
.pw{background:#f9fffe;border:2px solid #21d6f144;border-radius:14px;padding:36px;text-align:center;margin-top:20px}
.pw h2{font-size:16px;font-weight:800;color:#111;margin-bottom:6px}
.pw p{color:#999;font-size:13px;margin-bottom:20px;line-height:1.6}
</style>
</head>
<body>

<div class="hdr">
  <div class="logo">Update<em>!</em><small>Prompts</small></div>
  <div style="display:flex;gap:6px">
    <button class="btn" onclick="toggleAdm()">Admin</button>
    <button class="btn btn-c">Assinar R$29/mês</button>
  </div>
</div>

<div id="list">
<div class="wrap">

<div id="adm" class="adm">
  <div id="login">
    <h2>Acesso admin</h2>
    <div style="display:flex;gap:8px">
      <input type="password" id="pwd" placeholder="Senha..." style="flex:1" onkeydown="if(event.key==='Enter')auth()">
      <button class="btn btn-c" onclick="auth()">Entrar</button>
    </div>
    <p id="perr" style="font-size:11px;color:#e00;margin-top:6px;display:none">Senha incorreta</p>
  </div>
  <div id="form" style="display:none">
    <h2>Adicionar prompt</h2>
    <div class="row"><label class="lbl">Título</label><input type="text" id="ft" placeholder="Ex: Responder e-mail difícil sem parecer agressivo"></div>
    <div class="row"><label class="lbl">Descrição curta</label><input type="text" id="fd" placeholder="Quando usar este prompt"></div>
    <div class="row2">
      <div><label class="lbl">Categoria</label>
        <select id="fc"><option>Email</option><option>Reunião</option><option>Briefing</option><option>Copywriting</option><option>Pesquisa</option><option>Apresentação</option></select>
      </div>
      <div><label class="lbl">Ferramenta</label>
        <select id="ff"><option>Qualquer</option><option>Claude</option><option>ChatGPT</option><option>Gemini</option></select>
      </div>
    </div>
    <div class="row"><label class="lbl">O prompt</label><textarea id="fp" placeholder="Cole o prompt aqui..."></textarea></div>
    <div class="tog"><label class="sw"><input type="checkbox" id="fr" checked><span class="sl"></span></label><span>Gratuito (desliga = premium)</span></div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-c" onclick="pub()">Publicar prompt</button>
      <button class="btn" onclick="clr()">Limpar</button>
    </div>
  </div>
</div>

<div class="hero">
  <div class="hero-lbl">Update or Die · Repositório</div>
  <h1>Prompts para usar hoje.<br><span>Não amanhã. Agora.</span></h1>
  <p>Repositório curado com prompts do dia a dia. Nada teórico. Tudo testado.</p>
</div>

<input type="text" id="srch" placeholder="Buscar prompt..." oninput="render()" style="margin-bottom:10px">
<div class="pills" id="cpills"></div>
<div class="pills" id="fpills"></div>
<div class="cnt" id="cnt"></div>
<div class="grid" id="grid"></div>
<div class="empty" id="emp" style="display:none">Nenhum prompt encontrado.</div>
</div>
</div>

<div id="detail">
<div class="wrap">
  <button class="bk" onclick="back()">← voltar para prompts</button>
  <div class="ctags" id="dtags"></div>
  <h1 id="dtit"></h1>
  <p class="ds" id="ddsc"></p>
  <div id="dcnt"></div>
</div>
</div>

<script>
const PWD="uod2026";
const CC={Email:"#0ab8d4",Reunião:"#7c5cbf",Briefing:"#e07b2a",Copywriting:"#2a9e6b",Pesquisa:"#d44a6f",Apresentação:"#3a7bd5"};
const CATS=["Todos","Email","Reunião","Briefing","Copywriting","Pesquisa","Apresentação"];
const FERRS=["Todos","Qualquer","Claude","ChatGPT","Gemini"];
let PS=[],cat="Todos",ferr="Todos",adm=false,ok=false,cur=null;

function load(){
  try{const s=localStorage.getItem("uod_prompts");if(s)PS=JSON.parse(s);}catch(e){}
  if(!PS.length)PS=[
    {id:1,t:"Responder e-mail difícil sem parecer agressivo",d:"Quando você recebeu um e-mail que te irritou e precisa responder de forma profissional.",c:"Email",f:"Qualquer",free:true,p:"Preciso responder o e-mail abaixo de forma profissional e direta, sem soar agressivo ou passivo-agressivo. Mantenha o tom firme mas construtivo. Não invente informações.\n\nE-mail recebido:\n[cole o e-mail aqui]\n\nMeu ponto de vista:\n[explique brevemente o que aconteceu e o que você quer comunicar]"},
    {id:2,t:"Resumir reunião em 3 decisões e próximos passos",d:"Para quando você sai de uma reunião com a cabeça cheia e precisa registrar o que importa.",c:"Reunião",f:"Qualquer",free:true,p:"Transforme as notas abaixo em um resumo com exatamente este formato:\n\n3 decisões tomadas:\n1.\n2.\n3.\n\nPróximos passos:\n- [responsável] → [ação] → [prazo]\n\nFicou em aberto:\n- [o que não foi resolvido]\n\nNotas da reunião:\n[cole aqui]"},
    {id:3,t:"Reescrever texto corporativo em linguagem humana",d:"Aquele texto cheio de 'alavancar sinergias' que chegou para você editar.",c:"Copywriting",f:"Qualquer",free:false,p:""}
  ];
  save();render();
}

function save(){try{localStorage.setItem("uod_prompts",JSON.stringify(PS));}catch(e){}}
function tagH(l){const c=CC[l]||"#888";return`<span class="tag" style="color:${c};border:1px solid ${c}33;background:${c}11">${l}</span>`}
function toggleAdm(){adm=!adm;document.getElementById("adm").style.display=adm?"block":"none";if(!adm){ok=false;document.getElementById("login").style.display="block";document.getElementById("form").style.display="none";}}
function auth(){
  if(document.getElementById("pwd").value===PWD){ok=true;document.getElementById("login").style.display="none";document.getElementById("form").style.display="block";document.getElementById("perr").style.display="none";render();}
  else document.getElementById("perr").style.display="block";
}
function pub(){
  const t=document.getElementById("ft").value.trim();
  const d=document.getElementById("fd").value.trim();
  const p=document.getElementById("fp").value.trim();
  if(!t||!d||!p){alert("Preencha título, descrição e prompt.");return;}
  PS.unshift({id:Date.now(),t,d,c:document.getElementById("fc").value,f:document.getElementById("ff").value,free:document.getElementById("fr").checked,p});
  save();clr();render();alert("Prompt publicado!");
}
function clr(){["ft","fd","fp"].forEach(i=>document.getElementById(i).value="");document.getElementById("fr").checked=true;}
function del(id,e){e.stopPropagation();if(!confirm("Apagar este prompt?"))return;PS=PS.filter(p=>p.id!==id);save();render();}
function render(){
  const s=document.getElementById("srch").value.toLowerCase();
  const fl=PS.filter(p=>(p.t||"").toLowerCase().includes(s)||(p.d||"").toLowerCase().includes(s)).filter(p=>cat==="Todos"||p.c===cat).filter(p=>ferr==="Todos"||p.f===ferr);
  document.getElementById("cpills").innerHTML=CATS.map(c=>`<button class="pill ${c===cat?"on":""}" onclick="cat='${c}';render()">${c}</button>`).join("");
  document.getElementById("fpills").innerHTML=FERRS.map(f=>`<button class="pill ${f===ferr?"on":""}" onclick="ferr='${f}';render()">${f}</button>`).join("");
  document.getElementById("cnt").textContent=fl.length+" prompts encontrados";
  if(!fl.length){document.getElementById("grid").innerHTML="";document.getElementById("emp").style.display="block";return;}
  document.getElementById("emp").style.display="none";
  document.getElementById("grid").innerHTML=fl.map(p=>`
    <div class="card" onclick="show(${p.id})">
      ${ok?`<button class="del" style="display:block" onclick="del(${p.id},event)">×</button>`:(!p.free?'<div class="pm">premium</div>':"")}
      <div class="ctags">${tagH(p.c)}<span class="ttool">${p.f}</span></div>
      <h3>${p.t}</h3><p>${p.d}</p>
      <div class="cta ${p.free?"":"lk"}">${p.free?"Ver prompt →":"Desbloquear →"}</div>
    </div>`).join("");
}
function show(id){
  const p=PS.find(x=>x.id===id);if(!p)return;cur=p;
  document.getElementById("list").style.display="none";
  document.getElementById("detail").style.display="block";
  document.getElementById("dtags").innerHTML=tagH(p.c)+`<span class="ttool">${p.f}</span>`;
  document.getElementById("dtit").textContent=p.t;
  document.getElementById("ddsc").textContent=p.d;
  document.getElementById("dcnt").innerHTML=p.free
    ?`<div class="pbox"><div class="plbl">Prompt</div><div class="ptxt">${p.p.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</div></div><button class="btn btn-c" id="cpb" onclick="cp()">Copiar prompt</button>`
    :`<div class="pw"><h2>Prompt exclusivo para assinantes</h2><p>Acesse o repositório completo por <strong>R$29/mês</strong></p><button class="btn btn-c">Assinar agora</button></div>`;
  window.scrollTo(0,0);
}
function cp(){if(!cur)return;navigator.clipboard.writeText(cur.p);const b=document.getElementById("cpb");b.textContent="✓ Copiado!";setTimeout(()=>b.textContent="Copiar prompt",2000);}
function back(){document.getElementById("detail").style.display="none";document.getElementById("list").style.display="block";}
load();
</script>
</body>
</html>
